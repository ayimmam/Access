[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "access-learning-media"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2,<51",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
capture = ["mediapipe>=0.10.31,<0.11", "opencv-contrib-python>=4.11,<6"]

[tool.setuptools.packages.find]
where = ["services/core/src", "services/api/src", "services/worker/src"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
