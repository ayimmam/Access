name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Validate repository files
        run: python3 scripts/check_repository.py

      - name: Check Python syntax
        run: python3 -m compileall -q scripts services

  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Check tracked files and high-confidence credential patterns
        run: bash scripts/check_security_baseline.sh

  application-checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install uv
        run: python3 -m pip install uv==0.13.8
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.11
          npm ci
      - name: Build component and test API
        run: |
          npm run build
          uv run pytest
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test browser journeys and automated accessibility
        run: npm run test:browser

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [repository-checks, security-baseline, application-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CHECK_RESULTS"])
          unsuccessful = [name for name, job in results.items() if job["result"] != "success"]
          if unsuccessful:
              raise SystemExit("Verification jobs require attention: " + ", ".join(unsuccessful))
          print("All verification jobs succeeded.")
          PY
